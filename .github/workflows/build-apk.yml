name: Build CINOVA Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install NPM Dependencies
        run: npm ci --include=dev

      - name: Update Web Shell Assets
        run: |
          mkdir -p android/app/src/main/assets/public
          cp -r android-shell/* android/app/src/main/assets/public/

      - name: Grant Execute Permission for Gradlew
        run: chmod +x android/gradlew

      - name: Build Android Release and Debug APKs
        working-directory: ./android
        run: |
          set -o pipefail
          ./gradlew assembleRelease assembleDebug --no-daemon --stacktrace 2>&1 | tee ../gradle-build.log

      - name: Print Gradle Error on Failure
        if: failure()
        run: |
          echo "=== GRADLE FAILURE LOG (LAST 150 LINES) ==="
          tail -n 150 gradle-build.log

      - name: Upload Build Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: gradle-build.log

      - name: Locate and Sign Release APK for Direct Installation
        run: |
          mkdir -p apk-output

          echo "=== All Generated Build Outputs ==="
          find android/app/build/outputs/apk -type f -ls

          # Find release APK
          RELEASE_APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          DEBUG_APK=$(find android/app/build/outputs/apk/debug -name "*.apk" | head -n 1)

          echo "Found Release APK: $RELEASE_APK"
          echo "Found Debug APK: $DEBUG_APK"

          if [ -z "$RELEASE_APK" ]; then
            echo "ERROR: No release APK found!"
            exit 1
          fi

          # Locate apksigner in preinstalled Android SDK build-tools
          SDK_DIR="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          APKSIGNER=$(find $SDK_DIR/build-tools -name apksigner 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$APKSIGNER" ]; then
            APKSIGNER="apksigner"
          fi
          echo "Using apksigner: $APKSIGNER"

          # Generate an ephemeral CI signing keystore
          keytool -genkeypair -v \
            -keystore ci-release.keystore \
            -alias cinova \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass cinova123 \
            -keypass cinova123 \
            -dname "CN=CINOVA, OU=Mobile, O=CINOVA OTT, L=Mumbai, ST=MH, C=IN"

          # Sign release APK with Android v2 + v3 signature schemes for instant phone installation
          $APKSIGNER sign \
            --ks ci-release.keystore \
            --ks-key-alias cinova \
            --ks-pass pass:cinova123 \
            --key-pass pass:cinova123 \
            --out apk-output/CINOVA-v1.0-release.apk \
            "$RELEASE_APK"

          # Preserve raw unsigned release APK and debug APK
          cp "$RELEASE_APK" apk-output/CINOVA-v1.0-unsigned.apk
          if [ -n "$DEBUG_APK" ] && [ -f "$DEBUG_APK" ]; then
            cp "$DEBUG_APK" apk-output/CINOVA-v1.0-debug.apk
          fi

          # Verify signatures
          echo "=== Verifying signed release APK ==="
          $APKSIGNER verify --verbose apk-output/CINOVA-v1.0-release.apk

          echo "=== Final APK Artifacts ==="
          ls -lh apk-output/

      - name: Upload APKs as GitHub Actions Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CINOVA-Android-APK
          path: apk-output/*.apk
          retention-days: 30
