name: Build CINOVA Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install NPM Dependencies
        run: npm ci --include=dev

      - name: Configure Java 17 Compatibility for Capacitor
        run: |
          find node_modules/@capacitor -name "*.gradle" -exec sed -i 's/VERSION_21/VERSION_17/g' {} + 2>/dev/null || true
          echo "Patched Capacitor dependencies to Java 17"

      - name: Update Web Shell Assets
        run: |
          mkdir -p android/app/src/main/assets/public
          cp -r android-shell/* android/app/src/main/assets/public/

      - name: Grant Execute Permission for Gradlew
        run: chmod +x android/gradlew

      - name: Build Android Release APK
        working-directory: ./android
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee ../gradle.log

      - name: Publish Diagnostic Log on Failure
        if: failure()
        run: |
          echo "=== PUSHING DIAGNOSTIC LOG TO CI-DIAGNOSTICS BRANCH ==="
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan ci-diagnostics 2>/dev/null || git checkout -B ci-diagnostics
          git rm -rf . > /dev/null 2>&1 || true
          cp gradle.log build-failure-diagnostic.txt
          git add build-failure-diagnostic.txt
          git commit -m "chore(ci): capture build diagnostic log" || true
          git push -f origin ci-diagnostics || true

      - name: Locate and Sign Release APK for Direct Installation
        run: |
          mkdir -p apk-output

          echo "=== All Generated Build Outputs ==="
          find android/app/build/outputs/apk -type f -ls

          # Find release APK
          RELEASE_APK=$(find android/app/build/outputs/apk -name "*release*.apk" | head -n 1)
          if [ -z "$RELEASE_APK" ]; then
            RELEASE_APK=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)
          fi

          echo "Found Target APK: $RELEASE_APK"

          if [ -z "$RELEASE_APK" ]; then
            echo "ERROR: No release APK found!"
            exit 1
          fi

          # Locate apksigner in preinstalled Android SDK build-tools
          SDK_DIR="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          APKSIGNER=$(find $SDK_DIR/build-tools -name apksigner 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$APKSIGNER" ]; then
            APKSIGNER="apksigner"
          fi
          echo "Using apksigner: $APKSIGNER"

          # Generate an ephemeral CI signing keystore
          keytool -genkeypair -v \
            -keystore ci-release.keystore \
            -alias cinova \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass cinova123 \
            -keypass cinova123 \
            -dname "CN=CINOVA, OU=Mobile, O=CINOVA OTT, L=Mumbai, ST=MH, C=IN"

          # Sign release APK with Android v2 + v3 signature schemes for instant phone installation
          $APKSIGNER sign \
            --ks ci-release.keystore \
            --ks-key-alias cinova \
            --ks-pass pass:cinova123 \
            --key-pass pass:cinova123 \
            --out apk-output/CINOVA-v1.0-release.apk \
            "$RELEASE_APK"

          # Preserve raw unsigned release APK and debug APK
          cp "$RELEASE_APK" apk-output/CINOVA-v1.0-unsigned.apk
          if [ -n "$DEBUG_APK" ] && [ -f "$DEBUG_APK" ]; then
            cp "$DEBUG_APK" apk-output/CINOVA-v1.0-debug.apk
          fi

          # Verify signatures
          echo "=== Verifying signed release APK ==="
          $APKSIGNER verify --verbose apk-output/CINOVA-v1.0-release.apk

          echo "=== Final APK Artifacts ==="
          ls -lh apk-output/

      - name: Upload APKs as GitHub Actions Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CINOVA-Android-APK
          path: apk-output/*.apk
          retention-days: 30
